services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book_catalog}
      MYSQL_USER: ${MYSQL_USER:-book_catalog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-book_catalog}
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      YII_COOKIE_VALIDATION_KEY: ${YII_COOKIE_VALIDATION_KEY:-dev-cookie-validation-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-book-covers}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      SMSPILOT_API_KEY: ${SMSPILOT_API_KEY:-XXXXXXXXXXXXYYYYYYYYYYYYZZZZZZZZXXXXXXXXXXXXYYYYYYYYYYYYZZZZZZZZ}
      SMSPILOT_TEST: ${SMSPILOT_TEST:-1}
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer-cache
      - vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      sh -c "composer install --prefer-dist --no-interaction
      && mkdir -p runtime web/assets
      && php-fpm"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - vendor:/app/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book_catalog}
      MYSQL_USER: ${MYSQL_USER:-book_catalog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-book_catalog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-book-covers}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      "

volumes:
  composer-cache:
  vendor:
  db-data:
  minio-data:
