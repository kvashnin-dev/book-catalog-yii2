services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book_catalog}
      MYSQL_USER: ${MYSQL_USER:-book_catalog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-book_catalog}
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      YII_COOKIE_VALIDATION_KEY: ${YII_COOKIE_VALIDATION_KEY:-dev-cookie-validation-key}
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer-cache
      - vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --prefer-dist --no-interaction
      && mkdir -p runtime web/assets
      && php-fpm"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - vendor:/app/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book_catalog}
      MYSQL_USER: ${MYSQL_USER:-book_catalog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-book_catalog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  vendor:
  db-data:
